[build-system]
requires = ["setuptools>=61.0","wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bf_splitter"
dynamic = ["version"]
authors = [{name = "Victor Perez", email = "vdpm85@hotmail.com"}]

license = {text = "BSD-3-Clause"}
description = "bioformat _splitter is a cli tool to split multi-series files into various single series files"
readme = "README.md"
classifiers = [
    "Programming Language :: Python :: 3.12",
    "Operating System :: OS Independent",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: BSD License"
]
requires-python = ">=3.12"
dependencies = [
    "tifffile==2026.9.20",
    "bffile==0.1.1",
    "loguru==0.7.3",
    "imagecodecs==2026.3.6"
    ]

keywords = [
    "bio-formats",
    "bioformats",
    "ome.tif",
    "ome",
    "multi-series",
    "split files"
]

[tool.setuptools.packages.find]
where = ["src"]


[tool.setuptools.dynamic]
version = { attr = "bf_splitter.version.__version__" }

[project.optional-dependencies]
verifier = ["pandas==3.0.6",
            "dask==2026.8.0"
            ]

[project.scripts]
split-series = "bf_splitter.series_splitter:main"


[project.urls]
Homepage = "https://github.com/VictorDidier/bf_splitter"