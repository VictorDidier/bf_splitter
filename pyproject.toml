[build-system]
requires = ["setuptools>=61.0","wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mito-annotator"
dynamic = ["version"]
authors = [{name = "Victor Perez", email = "perez-meza@bioquant.uni-heidelberg.de"}]

license = {text = "BSD-3-Clause"}
description = "GUI tool to annotate phases on cell mitosis images"
readme = "README.md"
classifiers = [
    "Programming Language :: Python :: 3.12",
    "Operating System :: OS Independent",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: BSD License"
]
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.5.3",
    "pandas>=3.0.5",
    "bffile>=0.1.1",
    "PyQt6>=6.11.0",
    "pyqtgraph>=0.14.0"
    ]

keywords = [
    "annotation",
    "image annotation",
    "mitosis",
    "cell cycle",
    "prophase",
    "prometaphase",
    "metaphase",
    "anaphase",
    "telophase",
    "immunofluorescence",
    "fluorescence microscopy"
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.package-data]
mito_annotator = ["icons/*"]

[tool.setuptools.dynamic]
version = { attr = "mito_annotator.version.__version__" }

[project.optional-dependencies]
desktop-shortcut = ["pyshortcuts>=1.9",
                    "pywin32>=306; sys_platform == 'win32'"
                    ]

[project.scripts]
mito-annotator = "mito_annotator.app:main"
mito-annotator-create-shortcut = "mito_annotator.create_shortcut:main"


[project.gui-scripts]
mito-annotator-gui = "mito_annotator.app:main"



[project.urls]
Homepage = "https://bwgit.de/hd/cos/Nikon-Imaging-Center/analysis-pipelines/mitoevents/mito-annotator"